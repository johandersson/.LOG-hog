name: Cross-platform CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make scripts executable
        if: runner.os != 'Windows'
        run: chmod +x src/build.sh src/run_tests.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd src
          build.bat

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd src
          ./build.sh

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash src/run_tests.sh

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repoRoot = Get-Location
          $srcDir = Join-Path $repoRoot "src"
          $toolsDir = Join-Path $repoRoot ".tools"
          $buildDir = Join-Path $toolsDir "testbuild"
          $junitVersion = "1.10.2"
          $junitJar = Join-Path $toolsDir "junit-platform-console-standalone-$junitVersion.jar"
          $junitUrl = "https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/$junitVersion/junit-platform-console-standalone-$junitVersion.jar"

          New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null
          if (-not (Test-Path $junitJar)) {
            Invoke-WebRequest -Uri $junitUrl -OutFile $junitJar
          }

          if (Test-Path $buildDir) {
            Remove-Item -Recurse -Force $buildDir
          }
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

          $mainSources = Get-ChildItem -Path $srcDir -Recurse -Filter *.java |
            Where-Object { $_.FullName -notlike "$srcDir\test\*" } |
            ForEach-Object { $_.FullName }
          javac -encoding UTF-8 -cp ".;$junitJar" -d $buildDir $mainSources

          if (Test-Path (Join-Path $srcDir "resources")) {
            Copy-Item -Recurse -Force (Join-Path $srcDir "resources") $buildDir
          }

          $testSources = Get-ChildItem -Path (Join-Path $srcDir "test") -Recurse -Filter *.java | ForEach-Object { $_.FullName }
          javac -encoding UTF-8 -cp "$buildDir;$junitJar" -d $buildDir $testSources

          java -jar $junitJar execute --class-path $buildDir --scan-class-path --disable-banner --details=tree
